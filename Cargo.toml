[package]
name = "ferrumphp"
version = "0.1.0"
edition = "2024"
description = "A PHP Application Server"

[dependencies]
ext-php-rs = { version = "0.15.15", features = ["embed"] }
crossbeam-channel = "0.5.15"
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.5.3"
tokio-util = "0.7.18"
bytes = "1.11.1"
tokio-stream = "0.1.18"
http-body-util = "0.1.3"
futures-util = "0.3.32"
thiserror = "2.0.18"
clap = { version = "4.6.0", features = ["derive", "env"] }
anyhow = "1.0.102"
ipnet = "2.12.0"
tower-http = { version = "0.6.11", features = ["trace", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
log = "0.4.29"
[build-dependencies]
ext-php-rs-bindgen = "0.72.1-extphprs.1"
cc = "1.2.62"
