[package]
name = "ferrumphp"
version = "0.1.0"
edition = "2024"

[dependencies]
ext-php-rs = { version = "0.15.12", features = ["embed"] }
crossbeam-channel = "0.5.15"
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.5.3"
tokio-util = "0.7.18"
bytes = "1.11.1"
tokio-stream = "0.1.18"
http-body-util = "0.1.3"
futures-util = "0.3.32"
[build-dependencies]
ext-php-rs-bindgen = "0.72.1-extphprs.1"
cc = "1.2.62"
